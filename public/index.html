<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>Interactive Mathematics Lab</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<style>
  :root {
    --bg: #0f172a;
    --card: #1e293b;
    --accent: #38bdf8;
    --text: #e2e8f0;
    --muted: #94a3b8;
    --step: #0ea5e9;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 2rem 1rem;
  }
  .wrap { max-width: 700px; margin: 0 auto; }
  h1 { font-size: 1.6rem; margin-bottom: 0.25rem; }
  p.sub { color: var(--muted); margin-top: 0; margin-bottom: 1.5rem; }
  textarea {
    width: 100%;
    min-height: 90px;
    padding: 0.75rem;
    border-radius: 8px;
    border: 1px solid #334155;
    background: #0b1220;
    color: var(--text);
    font-size: 1rem;
    resize: vertical;
  }
  button {
    margin-top: 0.75rem;
    background: var(--accent);
    color: #0b1220;
    border: none;
    padding: 0.65rem 1.4rem;
    border-radius: 8px;
    font-weight: 600;
    font-size: 1rem;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  .card {
    background: var(--card);
    border-radius: 10px;
    padding: 1.25rem;
    margin-top: 1.5rem;
    display: none;
  }
  .card.show { display: block; }
  .topic-badge {
    display: inline-block;
    background: rgba(56, 189, 248, 0.15);
    color: var(--accent);
    padding: 0.2rem 0.6rem;
    border-radius: 999px;
    font-size: 0.85rem;
    margin-bottom: 0.75rem;
  }
  .step {
    font-family: "SF Mono", Menlo, monospace;
    background: #0b1220;
    padding: 0.5rem 0.75rem;
    border-left: 3px solid var(--step);
    margin: 0.4rem 0;
    border-radius: 4px;
    font-size: 0.95rem;
  }
  .answer {
    margin-top: 1rem;
    font-size: 1.15rem;
    font-weight: 700;
    color: #4ade80;
  }
  .error { color: #f87171; }
  .examples { margin-top: 0.5rem; font-size: 0.85rem; color: var(--muted); }
  .examples button {
    background: none;
    color: var(--accent);
    border: 1px solid #334155;
    font-weight: 400;
    font-size: 0.8rem;
    padding: 0.25rem 0.6rem;
    margin: 0.2rem 0.3rem 0 0;
  }
</style>
</head>
<body>
<div class="wrap">
  <h1>🧮 Interactive Mathematics Lab</h1>
  <p class="sub">Type or paste a question. GCD / Euclidean Algorithm is wired up end-to-end right now — other topics are placeholders.</p>

  <textarea id="question" placeholder="e.g. Find the gcd of 252 and 105 using the Euclidean algorithm"></textarea>
  <br />
  <button onclick="solve()">Solve</button>

  <div class="examples">
    Try:
    <button onclick="fill('Find gcd(252, 105) using the Euclidean algorithm')">gcd(252, 105)</button>
    <button onclick="fill('What is the greatest common divisor of 1071 and 462?')">gcd(1071, 462)</button>
  </div>

  <div class="card" id="result"></div>
</div>

<script>
function fill(text) {
  document.getElementById('question').value = text;
}

async function solve() {
  const question = document.getElementById('question').value.trim();
  const resultEl = document.getElementById('result');
  if (!question) return;

  resultEl.classList.add('show');
  resultEl.innerHTML = '<span class="topic-badge">Solving…</span>';

  try {
    const res = await fetch('/api/solve', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ question })
    });
    const data = await res.json();

    if (!data.ok) {
      resultEl.innerHTML = `<p class="error">${data.error || 'Something went wrong.'}</p>`;
      return;
    }

    let html = `<span class="topic-badge">${data.topic_label}</span>`;
    (data.explanation || []).forEach(line => {
      html += `<div class="step">${line}</div>`;
    });
    html += `<div class="answer">Answer: gcd(${data.input.a}, ${data.input.b}) = ${data.answer}</div>`;
    if (data.bonus_bezout) {
      html += `<p style="color:var(--muted); font-size:0.9rem; margin-top:0.75rem;">
                 Bonus (Bézout's identity): ${data.bonus_bezout.equation}
               </p>`;
    }
    resultEl.innerHTML = html;
  } catch (err) {
    resultEl.innerHTML = `<p class="error">Network error: ${err.message}</p>`;
  }
}
</script>
</body>
</html>
